<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Magic Envelope</title>
<style>
  html,body{height:100%;margin:0;background:#fbf8f1;color:#1e1e1e;font:20px/1.4 ui-rounded,system-ui,sans-serif}
  body{display:grid;place-items:center;text-align:center}
  @media (prefers-color-scheme:dark){html,body{background:#17161b;color:#ece8df}}
  button{font:inherit;padding:.5rem 1.25rem;border:2px solid currentColor;border-radius:10px;background:none;color:inherit}
</style>
</head>
<body>
  <!-- Shown only when the hosted app can't be reached (offline). -->
  <div>
    <div style="font-size:64px">✉</div>
    <p>📡 ✕</p>
    <button onclick="location.reload()">↻</button>
  </div>
</body>
</html>
